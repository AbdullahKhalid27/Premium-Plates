name: Deploy to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_ref:
        description: "Known-good full commit SHA to restore (blank uses selected branch)"
        required: false
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: premium-plates-site
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: premium-plates-site/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          STOREFRONT_PUBLIC_URL: ${{ vars.STOREFRONT_PUBLIC_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: premium-plates-site/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
